<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手法通乳操作视频</title>
<link rel="preload" href="hls/master.m3u8" as="fetch" crossorigin>
<style>
html,body{margin:0;background:#000;color:#E3EFED;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-tap-highlight-color:transparent}
.player{position:relative;background:#000;padding-top:env(safe-area-inset-top,0px)}
video{width:100%;aspect-ratio:16/9;display:block;background:#000}
#unmute{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:40px;padding:14px 26px;font-size:18px;font-weight:700;
  background:rgba(30,156,140,.95);color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4);cursor:pointer}
#unmute[hidden]{display:none}
.info{padding:12px 16px 28px;background:#0F1D1E;min-height:60vh}
h1{font-size:18px;margin:0 0 4px}
.meta{font-size:13px;color:#9AB2B0}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.chapters button{font:inherit;font-size:14px;text-align:left;display:flex;justify-content:space-between;gap:6px;cursor:pointer;
  background:transparent;color:#E3EFED;border:1px solid #25403F;border-radius:10px;padding:9px 10px}
.chapters button.on{border-color:#3CC2AF;color:#3CC2AF;font-weight:700}
.chapters time{color:#9AB2B0;font-size:12px}
.note{font-size:12px;color:#9AB2B0;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="player">
  <video id="v" autoplay playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5-page" controls preload="auto" poster="poster.jpg"></video>
  <button id="unmute" type="button" hidden>点击开启声音</button>
</div>
<div class="info">
  <h1>手法通乳标准操作演示</h1>
  <div class="meta">中医特色操作技术 · 操作视频 2-1 · 5分32秒 · 清晰度随网速自动调整</div>
  <div class="chapters" id="chapters"></div>
  <p class="note">参考依据：T/CACM 1603—2024《手法通乳中医技术操作规范》。本视频为教学示意动画，临床操作须由经规范化培训的医护人员实施。</p>
</div>
<script>
var v=document.getElementById('v'),btn=document.getElementById('unmute');
// HLS (自适应清晰度) where the browser plays it natively; small MP4 otherwise
v.src=v.canPlayType('application/vnd.apple.mpegurl')?'hls/master.m3u8':'video_360.mp4';
function start(){
  v.muted=false;
  var p=v.play();
  if(p&&p.catch)p.catch(function(){v.muted=true;v.play().catch(function(){});btn.hidden=false;});
}
btn.onclick=function(){v.muted=false;v.play();btn.hidden=true;};
v.addEventListener('volumechange',function(){if(!v.muted)btn.hidden=true;});
// 微信内允许带声音自动播放
if(window.WeixinJSBridge){WeixinJSBridge.invoke('getNetworkType',{},start);}
else{document.addEventListener('WeixinJSBridgeReady',function(){WeixinJSBridge.invoke('getNetworkType',{},start);},false);}
start();
var CH=[[0,'片头'],[4.5,'认识手法通乳'],[24.1,'中医理论'],[47.3,'适应证与禁忌'],[64.9,'操作前评估'],[91.9,'操作前准备'],
 [109.1,'① 清洁乳房'],[119.3,'辅助热敷'],[135.8,'② 放松乳房'],[151.1,'③ 穴位按摩'],[177.6,'④ 按揉乳晕'],[191.1,'⑤ 按压乳晕并对挤'],
 [219.8,'⑥ 推捋积乳'],[241.5,'⑦ 处理积乳肿块'],[262.0,'观察与时限'],[283.4,'操作后处置'],[295.9,'健康宣教'],[315.6,'要点回顾']];
var box=document.getElementById('chapters');
function fmt(s){return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2);}
CH.forEach(function(c){var b=document.createElement('button');b.type='button';b.innerHTML='<span>'+c[1]+'</span><time>'+fmt(c[0])+'</time>';
  b.onclick=function(){v.currentTime=c[0];v.muted=false;btn.hidden=true;v.play();window.scrollTo(0,0);};box.appendChild(b);});
var bs=[].slice.call(box.children);
v.addEventListener('timeupdate',function(){var k=0;CH.forEach(function(c,i){if(v.currentTime>=c[0]-.2)k=i;});bs.forEach(function(b,i){b.className=i===k?'on':'';});});
</script>
</body>
</html>
